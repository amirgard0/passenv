name: Build APT repository

# Builds the passenv .deb, signs an APT repository, and publishes it to
# GitHub Pages so users can install with apt.
#
# One-time setup (see README "Publishing the APT repository"):
#   1. Generate a dedicated signing key and export it as ASCII armor.
#   2. Add repository secrets:
#        GPG_PRIVATE_KEY       ASCII-armored private key block
#        GPG_PASSPHRASE        its passphrase (empty if none)
#   3. Enable GitHub Pages (Source: GitHub Actions).
#
# On every tag push (v*), the repo at Pages is rebuilt from all pool
# history plus the new .deb, so old versions remain installable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GPG key and detect key id
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY is not set. See README 'Publishing the APT repository'." >&2
            exit 1
          fi
          if ! printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import 2>import.log; then
            echo "::error::Secret GPG_PRIVATE_KEY is not a valid ASCII-armored key (got 'no valid OpenPGP data')." >&2
            echo "::error::It must be the full output of: gpg --armor --export-secret-keys <KEYID>" >&2
            echo "::error::Do NOT copy from CI logs (*** is masked) and do NOT paste interactively into gh; use:" >&2
            echo "::error::  gpg --armor --export-secret-keys <KEYID> | gh secret set GPG_PRIVATE_KEY --repo amirgard0/passenv" >&2
            sed 's/^/  /' import.log >&2
            exit 1
          fi
          KEYID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{key=$5} END{print substr(key, length(key)-15)}')
          if [ -z "$KEYID" ]; then
            echo "::error::Key imported but no secret key detected." >&2
            exit 1
          fi
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"
          gpg --list-secret-keys --keyid-format long

      - name: Build .deb
        run: ./scripts/build-deb.sh dist

      - name: Restore existing repo history
        run: |
          REPO=apt-repo
          mkdir -p $REPO
          # Reuse any existing Pages deployment so earlier versions stay
          # available in the pool.
          SITE=$(curl -fsSL --max-time 30 \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY_NAME}/dists/stable/Release" \
            >/dev/null 2>&1 && echo live || echo none)
          if [ "$SITE" = live ]; then
            BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY_NAME}"
            for deb in $(curl -fsSL "$BASE/dists/stable/main/binary-all/Packages" \
                | awk '/^Filename:/{print $2}'); do
              mkdir -p "$REPO/$(dirname "$deb")"
              curl -fsSL -o "$REPO/$deb" "$BASE/$deb"
            done
          fi
          cp dist/*.deb "$REPO/"

      - name: Sign APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./scripts/build-apt-repo.sh apt-repo "$KEYID"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
